# Builds the FERMI installers for Linux, Windows and macOS: the llama.cpp runtime (runtime/build.sh, at the commit in
# runtime/LLAMA_COMMIT, with FERMI's patches), then the Tauri app with the runtime inside.
# Runs on every push to main (installers as workflow artifacts) and on a version tag (v0.1.0...), which also makes a
# draft release with the installers attached.
name: build

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x64, os: ubuntu-22.04, bundles: "deb,appimage" }
          - { name: windows-x64, os: windows-latest, bundles: "nsis,msi" }
          - { name: macos-arm64, os: macos-14, bundles: "dmg" }
          - { name: macos-x64, os: macos-13, bundles: "dmg" }
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: llama.cpp source
        shell: bash
        run: |
          git init -q llama.cpp
          git -C llama.cpp remote add origin https://github.com/ggml-org/llama.cpp
          git -C llama.cpp fetch -q --depth 1 origin "$(cat runtime/LLAMA_COMMIT)"
          git -C llama.cpp checkout -q FETCH_HEAD

      - name: Linux packages and Vulkan SDK
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libvulkan-dev
          curl -sSL -o vulkan_sdk.tar.xz https://sdk.lunarg.com/sdk/download/latest/linux/vulkan_sdk.tar.xz
          mkdir -p "$RUNNER_TEMP/vulkan" && tar -xJf vulkan_sdk.tar.xz -C "$RUNNER_TEMP/vulkan"
          SDK=$(ls -d "$RUNNER_TEMP"/vulkan/*/x86_64)
          echo "VULKAN_SDK=$SDK" >> "$GITHUB_ENV"
          echo "$SDK/bin" >> "$GITHUB_PATH"

      - name: Vulkan SDK (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          curl.exe -sSL -o "$env:RUNNER_TEMP\vulkan-sdk.exe" https://sdk.lunarg.com/sdk/download/latest/windows/vulkan-sdk.exe
          & "$env:RUNNER_TEMP\vulkan-sdk.exe" --root C:\VulkanSDK --accept-licenses --default-answer --confirm-command install
          Add-Content $env:GITHUB_ENV "VULKAN_SDK=C:\VulkanSDK"
          Add-Content $env:GITHUB_PATH "C:\VulkanSDK\Bin"

      - name: Runtime (llama.cpp)
        shell: bash
        run: |
          set -o pipefail
          JOBS=4 runtime/build.sh "$PWD/llama.cpp" 2>&1 | tee runtime.log

      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: src-tauri }

      - name: App
        shell: bash
        run: |
          set -o pipefail
          npm ci 2>&1 | tee app.log
          npx tauri build --bundles ${{ matrix.bundles }} 2>&1 | tee -a app.log

      # the end of the failing log as an annotation: readable on the run page without signing in
      - name: Report failure
        if: failure()
        shell: bash
        run: |
          for f in runtime.log app.log; do
            [ -f "$f" ] || continue
            msg=$(grep -v '^\s*$' "$f" | tail -n 60 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=$f::$msg"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: FERMI-${{ matrix.name }}
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/dmg/*.dmg

      - name: Draft release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/dmg/*.dmg
